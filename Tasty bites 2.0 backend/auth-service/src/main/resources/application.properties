# App Details
spring.application.name=auth-service
server.port=${PORT:8081}

# DB Config
#spring.datasource.url=jdbc:mysql://tastybites.cbqsiqiaot3g.eu-north-1.rds.amazonaws.com:3306/restaurant
#spring.datasource.username=admin
#spring.datasource.password=Ravindra7511
